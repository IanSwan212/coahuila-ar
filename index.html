<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coahuila Aumentada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@600&family=Work+Sans:wght@400;600;700&display=swap">

<script type="module" src="./mindar/mindar-image-aframe.prod.js"></script>

<style>
/* Layout: cámara a pantalla completa; sobre el cartel flotan las fotos de cada apartado; la ficha sube desde abajo */
:root{--kraft:#f2e8d3;--ink:#1d3b2a;--verde:#2f6b3a;--azul:#1f4fa3;--sol:#f2b419;--barro:#c8502e;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;--hand:"Caveat","Comic Sans MS",cursive;--body:"Work Sans",system-ui,sans-serif}
*{box-sizing:border-box}
/* sin fondo: MindAR pone el video de la cámara detrás de la escena y un fondo lo taparía */
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:var(--body);color:var(--ink)}
.ar{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.ar a-scene{width:100%;height:100%}
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--azul);
  background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.3px);background-size:9px 9px;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.card{background:var(--kraft);max-width:420px;width:100%;padding:24px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:4px 6px 0 rgba(0,0,0,.35);
  clip-path:polygon(0 2%,12% 0,26% 1.5%,40% 0,55% 2%,70% 0,85% 1.5%,100% 0,100% 98%,86% 100%,70% 98.5%,52% 100%,36% 98%,20% 100%,0 98.5%)}
.card h1{font-family:var(--display);font-size:clamp(2.4rem,12vw,3.4rem);line-height:.9;margin:0}
.tape{align-self:flex-start;background:var(--sol);font-family:var(--hand);font-size:1.4rem;padding:2px 12px;transform:rotate(-2deg)}
.card p{margin:0;line-height:1.45}
.go{font-family:var(--display);font-size:1.1rem;border:0;background:var(--barro);color:var(--kraft);padding:14px 18px;cursor:pointer;box-shadow:3px 4px 0 rgba(0,0,0,.3)}
.hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1.5deg);z-index:10;
  background:var(--sol);font-family:var(--hand);font-size:1.5rem;padding:4px 16px;box-shadow:3px 4px 0 rgba(0,0,0,.35);white-space:nowrap}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:62vh;overflow-y:auto;background:var(--kraft);
  padding:30px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  clip-path:polygon(0 14px,6% 4px,13% 12px,21% 2px,30% 11px,38% 3px,47% 12px,55% 2px,64% 10px,72% 3px,81% 12px,89% 4px,100% 11px,100% 100%,0 100%);
  transition:transform .3s ease}
.sheet.off{transform:translateY(105%)}
.sheet.drag{transition:none}
.grip{position:sticky;top:-22px;display:flex;justify-content:center;margin:-18px 0 4px;z-index:2;pointer-events:none}
.grip span{width:46px;height:5px;border-radius:3px;background:rgba(29,59,42,.35)}
.in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.cat{font-family:var(--hand);font-size:1.4rem;color:var(--barro)}
.sheet h2{font-family:var(--display);font-size:clamp(1.4rem,6.5vw,2rem);line-height:.95;margin:0;text-transform:uppercase}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#111;border:5px solid #fff}
.ph .bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(18px) brightness(.65)}
.ph img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.pcap{font-family:var(--hand);font-size:1.2rem;margin:0}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.facts li{background:#fff8e6;padding:8px 11px;border-left:6px solid var(--verde);line-height:1.4;font-size:.95rem}
.orgullo{background:var(--ink);color:var(--sol);font-family:var(--hand);font-size:1.35rem;padding:7px 12px;transform:rotate(-1deg)}
.row{display:flex;justify-content:space-between;gap:8px}
.btn{font-family:var(--display);font-size:.8rem;border:0;background:var(--azul);color:var(--kraft);padding:10px 12px;cursor:pointer}
.btn.x{background:var(--barro)}.btn.v{background:var(--verde)}
.btn:focus-visible,.go:focus-visible{outline:3px dashed var(--sol);outline-offset:3px}
[hidden]{display:none!important}
.top2{position:fixed;top:calc(84px + env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:14;display:flex;gap:6px}
.top2 .btn{font-size:.72rem;padding:8px 10px;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
/* mapa 3D */
.mapa model-viewer{width:100%;height:min(62vh,440px);background:radial-gradient(circle at 50% 45%,#5d86c9,#1f4fa3);--poster-color:transparent}
.pinmap{width:18px;height:18px;padding:0;border-radius:50%;background:var(--sol);border:3px solid var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.35);font-size:0;color:transparent}
.pinmap[aria-pressed="true"]{width:auto;height:auto;padding:3px 8px;border-radius:999px;background:var(--barro);color:var(--kraft);font-family:var(--display);font-size:.66rem;white-space:nowrap;z-index:2}
.lugares{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.lugares button{flex:none;font-family:var(--display);font-size:.7rem;border:0;background:#fff8e6;color:var(--ink);padding:7px 10px;cursor:pointer}
.lugares button[aria-pressed="true"]{background:var(--sol)}
.lugar{background:#fff8e6;border-left:6px solid var(--sol);padding:9px 12px;line-height:1.4;min-height:3.2em}
/* línea del tiempo */
.linea{list-style:none;margin:0;padding:0 0 0 22px;position:relative;display:flex;flex-direction:column;gap:12px}
.linea::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(var(--ink) 0 10px,transparent 10px 16px);opacity:.25}
.linea::after{content:"";position:absolute;left:8px;top:6px;width:4px;height:calc((100% - 12px) * var(--prog,0));background:var(--barro);transition:height .2s linear}
.hito{position:relative;background:#fff8e6;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;width:100%;
  opacity:0;transform:translateX(-30px) rotate(-3deg) scale(.92);box-shadow:2px 3px 0 rgba(0,0,0,.2)}
.hito.vis{animation:hitoin .6s cubic-bezier(.3,1.4,.5,1) forwards}
.hito img{transform:scale(.4) rotate(-12deg);transition:transform .6s cubic-bezier(.3,1.6,.5,1) .2s}
.hito.vis img{transform:none}
.hito::before{content:"";position:absolute;left:-19px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--sol);border:3px solid var(--ink)}
.hito:nth-child(even){transform:translateX(-18px) rotate(1deg)}
@keyframes hitoin{to{opacity:1;transform:none}}
.anim{width:100%;max-height:70vh;background:#000;border:5px solid #fff;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.hito .anio{font-family:var(--display);font-size:1.5rem;line-height:1;color:var(--barro)}
.hito b{display:block;margin:2px 0}
.hito img{width:64px;height:64px;object-fit:cover;border:3px solid #fff;box-shadow:1px 2px 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.hito{animation:none!important;opacity:1;transform:none}.hito img{transform:none}}
.pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,20,15,.4)}
.pop .box{width:min(84vw,420px);display:flex;flex-direction:column;align-items:center;gap:8px;animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
.pop.out .box{animation:popout .45s ease-in forwards}
.pop.out{transition:opacity .45s;opacity:0}
.pop model-viewer{width:100%;aspect-ratio:1;background:radial-gradient(circle at 50% 45%,#fff8e6 0,#e9dcbd 55%,rgba(233,220,189,0) 72%);--poster-color:transparent}
.pop #pimg{width:100%;max-height:60vh;object-fit:contain;border:8px solid #fff;box-shadow:4px 6px 0 rgba(0,0,0,.35);transform:rotate(-2deg);background:#fff}
.pop .pcred{font-size:.7rem;color:#fff;opacity:.85}
.pop .plab{background:var(--sol);font-family:var(--hand);font-size:1.45rem;padding:3px 14px;transform:rotate(-2deg);box-shadow:3px 4px 0 rgba(0,0,0,.3);text-align:center}
@keyframes popin{0%{transform:scale(.2) translateY(40%);opacity:0}100%{transform:none;opacity:1}}
@keyframes popout{to{transform:scale(.3) translateY(-30%);opacity:0}}
.m3d{display:flex;flex-direction:column;gap:6px}
.m3d model-viewer{width:100%;aspect-ratio:4/3;background:radial-gradient(circle at 50% 40%,#fff8e6,#d9c9a6);border:5px solid #fff;--poster-color:transparent}
.m3d .lab{align-self:flex-start;font-family:var(--display);font-size:.8rem;background:var(--sol);padding:3px 9px;transform:rotate(-1.5deg)}
/* modo explorar: el cartel en pantalla con sus apartados tocables, como en la versión interactiva */
.explore{position:fixed;inset:0;z-index:13;overflow-y:auto;background:var(--azul);
  background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.3px);background-size:9px 9px;
  padding:calc(58px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.ex-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.poster{position:relative;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.4)}
/* animaciones del cartel en pantalla (animaciones.js): entrada por capas, 3D al mover y linterna */
.poster{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.poster img{transition:filter .9s ease}
.poster.anim-base img{filter:grayscale(.85) brightness(.5) blur(1.5px)}
.anim-capas{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.anim-pieza{position:absolute;background-repeat:no-repeat;opacity:0;transform:translateZ(70px) translateY(18px) scale(.9);
  transition:opacity .45s ease,transform .6s cubic-bezier(.2,1.35,.4,1),filter .9s ease,box-shadow .3s ease}
.anim-pieza.on{opacity:1;transform:none}
.anim-pieza.on-titulo{opacity:1;transform:none;transition:opacity .3s ease,transform .8s cubic-bezier(.2,1.6,.4,1),filter .9s ease}
.anim-pieza:not(.on):not(.on-titulo).titulo{transform:scale(1.35)}
.poster.anim-oscuro .anim-pieza{filter:brightness(.62) saturate(.55)}
.anim-pieza.alto{transform:translateZ(30px) scale(1.025);box-shadow:0 18px 30px rgba(0,0,0,.45);z-index:1}
.anim-luz{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(circle at var(--lx,50%) var(--ly,50%),rgba(255,236,200,.32) 0,rgba(255,236,200,.1) 16%,rgba(10,18,14,.22) 42%);transform:translateZ(31px)}
.poster .hs{transform:translateZ(40px)}
@media (prefers-reduced-motion:reduce){.poster,.anim-pieza{transition:none;transform:none}.anim-luz{display:none}}
.poster img{display:block;width:100%;height:auto}
.hs{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}
.hs .dot{position:absolute;right:2%;bottom:4%;width:22px;height:22px;border-radius:50%;background:var(--sol);border:3px solid var(--ink);animation:pulse 2s infinite}
.hs.seen .dot{background:var(--verde);animation:none}
.hs.sel{outline:4px dashed var(--sol);outline-offset:-4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,180,25,.8)}70%{box-shadow:0 0 0 12px rgba(242,180,25,0)}100%{box-shadow:0 0 0 0 rgba(242,180,25,0)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;font-family:var(--display);font-size:.78rem;background:var(--kraft);color:var(--ink);border:0;padding:8px 11px;cursor:pointer;clip-path:polygon(2% 0,98% 6%,100% 94%,0 100%)}
.chip.seen{background:var(--verde);color:var(--kraft)}
.skipv{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:13}
.found{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%) rotate(-1deg);z-index:12;background:var(--kraft);font-family:var(--hand);font-size:1.3rem;padding:4px 14px;box-shadow:3px 4px 0 rgba(0,0,0,.35);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.hs .dot{animation:none}}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));z-index:14;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.stamp{font-family:var(--display);font-size:.78rem;color:var(--kraft);background:rgba(29,59,42,.75);border:2px dashed var(--kraft);padding:4px 9px;transform:rotate(2deg);font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;background:var(--th,var(--verde));color:var(--tf,var(--kraft));padding:10px 12px}
.head .cat{color:inherit}
.num{font-family:var(--display);font-size:.75rem;font-variant-numeric:tabular-nums}
.gnav{display:flex;gap:6px;flex-wrap:wrap}
.gnav button{font-family:var(--display);font-size:.7rem;border:0;padding:6px 9px;background:#fff8e6;color:var(--ink);cursor:pointer}
.gnav button[aria-current="true"]{background:var(--th,var(--verde));color:var(--tf,var(--kraft))}
.meter{display:grid;gap:4px}
.meter .nm{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;font-variant-numeric:tabular-nums}
.meter .tr{height:18px;background:repeating-linear-gradient(90deg,#e4d8bd 0 6px,#dccfb2 6px 7px)}
.meter .fl{height:100%;width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.tag{font-size:.7rem;font-weight:700;padding:2px 6px;background:#e4d8bd}
.tag.win{background:var(--verde);color:var(--kraft)}.tag.lose{background:var(--azul);color:var(--kraft)}
.small{font-size:.72rem;opacity:.7}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--display)}
.score b{font-size:2.2rem;line-height:1;color:var(--verde);font-weight:400}.score b:nth-of-type(2){color:var(--azul)}
.score span{font-family:var(--body);font-weight:700;font-size:.82rem}
select{font:inherit;font-weight:600;padding:8px;border:2px solid var(--ink);background:#fff8e6;color:var(--ink);max-width:100%}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="card">
    <span class="tape">Cartel vivo</span>
    <h1>COAHUILA</h1>
    <p>Apunta la cámara al cartel impreso. Sobre cada apartado aparecerán sus fotos; tócalas para ver los datos y escuchar el sonido del lugar.</p>
    <button class="go" id="go">Encender la cámara</button>
    <button class="btn" id="nocam" style="align-self:flex-start">Explorar sin cámara</button>
    <p id="err" style="color:var(--barro);font-weight:700" hidden></p>
  </div>
</div>
<div class="top" id="top" hidden><span class="stamp" id="count">0/11 EXPLORADO</span><span style="display:flex;gap:6px"><button class="btn" id="ex">Explorar cartel</button><button class="btn v" id="vs">Comparar</button></span></div>
<div class="pop" id="pop" hidden><div class="box"><img id="pimg" alt="" hidden><model-viewer id="pmv" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="60deg" shadow-intensity="1" exposure="1.1" interaction-prompt="none" loading="eager" alt="Modelo 3D"></model-viewer><span class="plab" id="plab"></span><span class="pcred" id="pcred"></span></div></div>
<div class="top2" id="top2" hidden><button class="btn x" id="bmapa">Mapa 3D</button><button class="btn" id="blinea">Línea del tiempo</button></div>
<div class="found" id="found" hidden>¡Cartel detectado! Toca un apartado</div>
<div class="explore" id="explore" hidden><div class="ex-in">
  <div class="poster" id="poster"><img src="cartel.jpg?v=34" alt="Cartel de Coahuila"></div>
  <div class="chips" id="chips"></div>
  <button class="btn x" id="back">Volver a la cámara</button>
</div></div>
<div class="hint" id="hint" hidden>Apunta al cartel completo</div>
<button class="btn x skipv" id="skipv" hidden>Saltar video y explorar</button>
<video id="vintro" src="linea-tiempo.mp4?v=35" playsinline preload="auto" crossorigin="anonymous" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<div class="ar" id="ar">
<a-scene id="scene" embedded gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/" mindar-image="imageTargetSrc: ./targets.mind?v=34; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
  cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable">
  <a-assets id="assets"></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
</div>

<section class="sheet off" id="sheet" role="dialog" aria-modal="false" aria-label="Ficha del apartado">
  <div class="grip" aria-hidden="true"><span></span></div>
  <div class="in" id="body"></div>
</section>

<script>
// alto del cartel en unidades de la escena (ancho = 1)
const H = 1491 / 1055;
const scene = document.getElementById("scene"), target = document.getElementById("target");
const audio = new Audio();
let cur = null, pi = 0;

// una zona tocable y una foto flotante por apartado
function build() {
  const assets = document.getElementById("assets");
  // tarjetas de la franja inferior: abren el apartado al que pertenecen
  ZONES.forEach(z => {
    const s = S.find(x => x.id === z.ref);
    const zone = document.createElement("a-plane");
    zone.setAttribute("class", "clickable"); zone.dataset.sec = z.ref;
    zone.setAttribute("position", `${(z.x + z.w / 2) / 100 - 0.5} ${H / 2 - (z.y + z.h / 2) / 100 * H} 0.005`);
    zone.setAttribute("width", z.w / 100);
    zone.setAttribute("height", z.h / 100 * H);
    zone.setAttribute("material", "color: #f2b419; opacity: 0.12; transparent: true; side: double");
    zone.addEventListener("click", () => open(s));
    target.appendChild(zone);
  });
  S.forEach(s => {
    const cx = (s.x + s.w / 2) / 100 - 0.5, cy = H / 2 - (s.y + s.h / 2) / 100 * H;
    const zone = document.createElement("a-plane");
    zone.setAttribute("class", "clickable"); zone.dataset.sec = s.id;
    zone.setAttribute("position", `${cx} ${cy} 0.005`);
    zone.setAttribute("width", s.w / 100);
    zone.setAttribute("height", s.h / 100 * H);
    zone.setAttribute("material", "color: #f2b419; opacity: 0.12; transparent: true; side: double");
    zone.addEventListener("click", () => open(s));
    target.appendChild(zone);

    const pics = PICS[s.id] || [];
    pics.forEach((p, j) => {
      const a = document.createElement("img");
      a.id = `p-${s.id}-${j}`; a.src = p.f; a.crossOrigin = "anonymous";
      assets.appendChild(a);
    });
    if (!pics.length) return;
    const w = Math.min(0.26, s.w / 100 * 0.8);
    const card = document.createElement("a-entity");
    card.setAttribute("position", `${cx} ${cy} 0.06`);
    card.setAttribute("animation", `property: position; to: ${cx} ${cy} 0.1; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine`);
    const frame = document.createElement("a-plane");
    frame.setAttribute("width", w + 0.02); frame.setAttribute("height", w * 0.75 + 0.02);
    frame.setAttribute("material", "color: #ffffff; shader: flat");
    frame.setAttribute("class", "clickable"); frame.dataset.sec = s.id;
    frame.addEventListener("click", () => open(s));
    const img = document.createElement("a-image");
    img.setAttribute("src", `#p-${s.id}-0`);
    img.setAttribute("width", w); img.setAttribute("height", w * 0.75);
    img.setAttribute("position", "0 0 0.002");
    img.setAttribute("class", "clickable"); img.dataset.sec = s.id;
    img.addEventListener("click", () => open(s));
    card.appendChild(frame); card.appendChild(img);
    target.appendChild(card);
    let k = 0;
    setInterval(() => { k = (k + 1) % pics.length; img.setAttribute("src", `#p-${s.id}-${k}`); }, 3500);
  });
}

// modelos 3D reales (Smithsonian Open Access) para algunos apartados
const MODELS = {
  identidad: { img: 0, name: "Firma del Plan de Guadalupe, 1913" },

// modelo flotando sobre el apartado en la cámara
let floating = null;
function showFloating(s, m, pic) {
  if (floating) { floating.parentNode && floating.parentNode.removeChild(floating); floating = null; }
  if (!m) return;
  const cx = (s.x + s.w / 2) / 100 - 0.5, cy = H / 2 - (s.y + s.h / 2) / 100 * H;
  const e = document.createElement("a-entity");
  e.setAttribute("position", `${cx} ${cy} 0.2`);
  e.setAttribute("animation__in", "property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; easing: easeOutBack");
  if (pic) {
    const im = document.createElement("a-image");
    im.setAttribute("src", pic.f); im.setAttribute("width", 0.42); im.setAttribute("height", 0.315);
    const back = document.createElement("a-plane");
    back.setAttribute("width", 0.45); back.setAttribute("height", 0.345); back.setAttribute("position", "0 0 -0.002");
    back.setAttribute("material", "color: #ffffff; shader: flat");
    e.appendChild(back); e.appendChild(im);
  } else {
    const g = document.createElement("a-entity");
    g.setAttribute("gltf-model", m.src);
    if (m.anim) g.setAttribute("animation-mixer", `clip: ${m.anim}; loop: repeat`);
    g.setAttribute("animation", "property: rotation; from: 0 -40 0; to: 0 320 0; loop: true; dur: 9000; easing: linear");
    g.addEventListener("model-loaded", () => {
      const o = g.getObject3D("mesh"); if (!o) return;
      const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
      o.scale.multiplyScalar(0.4 / Math.max(size.x, size.y, size.z, 1e-6));
      const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
      o.position.sub(c);
    });
    e.appendChild(g);
  }
  target.appendChild(e); floating = e;
}

// cerrar la ficha deslizándola hacia abajo
(function () {
  const sh = document.getElementById("sheet");
  let y0 = null, dy = 0;
  sh.addEventListener("touchstart", e => {
    if (sh.classList.contains("off")) return;
    y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { sh.classList.add("drag"); sh.style.transform = `translateY(${dy}px)`; if (e.cancelable) e.preventDefault(); }
    else { y0 = null; sh.classList.remove("drag"); sh.style.transform = ""; }
  }, { passive: false });
  sh.addEventListener("touchend", () => {
    if (y0 === null) return;
    sh.classList.remove("drag"); sh.style.transform = "";
    if (dy > 90) closeSheet();
    y0 = null; dy = 0;
  });
})();

    const c = document.createElement("button"); c.className = "chip"; c.textContent = s.c; c.onclick = () => open(s); chips.appendChild(c); s.chipEl = c;
  });
  ZONES.forEach(z => {
    const s = S.find(x => x.id === z.ref);
    const b = document.createElement("button"); b.className = "hs"; b.setAttribute("aria-label", s.t);
    Object.assign(b.style, { left: z.x + "%", top: z.y + "%", width: z.w + "%", height: z.h + "%" });
    b.innerHTML = '<span class="dot"></span>'; b.onclick = () => open(s); poster.appendChild(b);
  });
})();
document.getElementById("count").textContent = `0/${S.length} EXPLORADO`;
function markSeen(s) {
  S.forEach(x => x.hsEl && x.hsEl.classList.toggle("sel", x === s));
  s.hsEl && s.hsEl.classList.add("seen"); s.chipEl && s.chipEl.classList.add("seen");
}
document.getElementById("nocam").onclick = () => { document.getElementById("intro").hidden = true; document.getElementById("top").hidden = false; document.getElementById("top2").hidden = false; document.getElementById("explore").hidden = false; };
document.getElementById("ex").onclick = () => { document.getElementById("explore").hidden = false; closeSheet(); };
document.getElementById("back").onclick = () => { document.getElementById("explore").hidden = true; closeSheet(); };

// toques sobre el cartel en cámara: rayo propio además del cursor de A-Frame (más confiable en celular)
(function () {
  let downX = 0, downY = 0;
  scene.addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; });
  scene.addEventListener("pointerup", e => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 12 || !scene.camera) return;
    const r = scene.canvas.getBoundingClientRect();
    const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    const ray = new THREE.Raycaster(); ray.setFromCamera(v, scene.camera);
    const meshes = []; target.object3D.traverse(o => { if (o.isMesh && o.el && o.el.dataset.sec) meshes.push(o); });
    const hit = ray.intersectObjects(meshes, false)[0];
    if (hit && introState !== "playing") { const s = S.find(x => x.id === hit.object.el.dataset.sec); if (s && s !== cur) open(s); }
  });
})();

// la película se proyecta sobre el cartel la primera vez que se detecta; al terminar (o al saltarla) empieza el recorrido
const vintro = document.getElementById("vintro"), skipv = document.getElementById("skipv");
let introState = "pending", introEl = null; // pending -> playing -> done
function introShow(on) { [...target.children].forEach(c => { if (c !== introEl && c.object3D) c.object3D.visible = !on; }); }
function introStart() {
  introState = "playing";
  introEl = document.createElement("a-video");
  introEl.setAttribute("src", "#vintro"); introEl.setAttribute("width", H * 9 / 16); introEl.setAttribute("height", H);
  introEl.setAttribute("position", "0 0 0.02");
  introEl.setAttribute("animation__in", "property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 700; easing: easeOutBack");
  target.appendChild(introEl); introShow(true); skipv.hidden = false;
  vintro.currentTime = 0; vintro.muted = false;
  vintro.play().catch(() => { vintro.muted = true; vintro.play(); });
}
function introEnd() {
  if (introState !== "playing") return;
  introState = "done"; vintro.pause(); skipv.hidden = true;
  if (introEl) { introEl.parentNode && introEl.parentNode.removeChild(introEl); introEl = null; }
  introShow(false);
  const f = document.getElementById("found"); f.textContent = "¡Ahora explora! Toca un apartado"; f.hidden = false; clearTimeout(f._t); f._t = setTimeout(() => f.hidden = true, 3500);
}
vintro.onended = introEnd; skipv.onclick = introEnd;
target.addEventListener("targetFound", () => {
  document.getElementById("hint").hidden = true;
  if (introState === "pending") return introStart();
  if (introState === "playing") return void vintro.play().catch(() => {});
  const f = document.getElementById("found"); f.hidden = false; clearTimeout(f._t); f._t = setTimeout(() => f.hidden = true, 2500);
});
target.addEventListener("targetLost", () => { document.getElementById("hint").hidden = false; if (introState === "playing") vintro.pause(); });

// explica en palabras claras por qué no abrió la cámara
function fail(msg) {
  const err = document.getElementById("err");
  err.hidden = false; err.textContent = msg;
  document.getElementById("intro").hidden = false;
  document.getElementById("hint").hidden = true;
  document.getElementById("go").disabled = false;
}
const inApp = /Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok|Snapchat|; wv\)/i.test(navigator.userAgent);
if (inApp) fail("Estás dentro de una app (WhatsApp, Instagram, Facebook o un lector de QR). Toca los tres puntos ⋮ o el ícono de compartir y elige \"Abrir en Chrome\" o \"Abrir en Safari\".");

scene.addEventListener("arError", () => fail("La cámara se abrió pero no pudo iniciar el video. Cierra otras apps que usen la cámara y vuelve a intentar."));
scene.addEventListener("arReady", () => {
  window.camOn = true;
  document.getElementById("intro").hidden = true;
  document.getElementById("hint").hidden = false;
  document.getElementById("top").hidden = false; document.getElementById("top2").hidden = false;
});

document.getElementById("go").onclick = async () => {
  const go = document.getElementById("go");
  document.getElementById("err").hidden = true;
  go.disabled = true; go.textContent = "Abriendo cámara…";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    go.textContent = "Encender la cámara";
    return fail("Este navegador no permite usar la cámara aquí. Abre el link en Chrome (Android) o Safari (iPhone).");
  }
  // primero pedimos la cámara nosotros, para mostrar el error exacto
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    st.getTracks().forEach(t => t.stop());
    // desbloquea el audio de la película con este toque (iPhone y Android exigen un gesto del usuario)
    vintro.muted = false; vintro.play().then(() => vintro.pause()).catch(() => {});
    await new Promise(r => setTimeout(r, 600));
  } catch (e) {
    go.textContent = "Encender la cámara";
    const m = {
      NotAllowedError: "El permiso de cámara está bloqueado. Toca el candado junto al link → Permisos → Cámara → Permitir, y recarga la página.",
      NotFoundError: "No se encontró ninguna cámara en este dispositivo.",
      NotReadableError: "Otra app está usando la cámara. Ciérrala y vuelve a intentar.",
      OverconstrainedError: "La cámara trasera no está disponible. Intenta en otro navegador.",
      SecurityError: "El navegador bloqueó la cámara por seguridad. Abre el link en Chrome o Safari."
    };
    return fail(m[e && e.name] || "No se pudo abrir la cámara (" + (e && e.name) + "). Abre el link en Chrome o Safari.");
  }
  try {
    await new Promise(r => scene.hasLoaded ? r() : scene.addEventListener("loaded", r, { once: true }));
    if (!target.children.length) build();
    audio.src = "snd/desierto.mp3"; audio.volume = 0; audio.play().catch(() => {}).finally(() => { audio.pause(); audio.volume = 1; });
    await scene.systems["mindar-image-system"].start();
    go.textContent = "Encender la cámara";
  } catch (e) {
    go.textContent = "Encender la cámara";
    fail("No se pudo iniciar la realidad aumentada (" + (e && e.message) + ").");
  }
};
</script>
