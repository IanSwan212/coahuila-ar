<!doctype html>
<meta charset="utf-8">
<title>Compilar objetivo RA</title>
<p id="s">Compilando…</p>
<script type="module">
import "./mindar/mindar-image.prod.js";
const s = document.getElementById("s");
try {
  const img = new Image();
  img.src = "cartel.jpg";
  await img.decode();
  const compiler = new window.MINDAR.IMAGE.Compiler();
  await compiler.compileImageTargets([img], p => { s.textContent = "Compilando " + p.toFixed(0) + "%"; });
  const buf = await compiler.exportData();
  const r = await fetch("/guardar/targets.mind", { method: "POST", body: buf });
  s.textContent = r.ok ? "LISTO " + buf.byteLength : "ERROR al guardar";
} catch (e) { s.textContent = "ERROR " + e; }
</script>
