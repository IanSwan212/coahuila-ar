<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR del Cartel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@600&family=Work+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
body{margin:0;background:#1f4fa3;font-family:"Work Sans",system-ui,sans-serif;color:#1d3b2a;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
.card{background:#f2e8d3;max-width:440px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:4px 6px 0 rgba(0,0,0,.35)}
h1{font-family:"Bowlby One",Impact,sans-serif;margin:0;font-size:1.8rem}
input{font:inherit;padding:10px;border:2px solid #1d3b2a;background:#fff8e6}
.sticker{align-self:center;background:#fff;padding:10px 10px 4px;transform:rotate(-2deg);box-shadow:3px 4px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:2px}
.sticker img{width:150px;height:150px;image-rendering:pixelated}
.sticker span{font-family:Caveat,cursive;font-size:1.3rem}
p{margin:0;line-height:1.4;font-size:.92rem}
</style>
</head>
<body>
<div class="card">
  <h1>QR pequeño</h1>
  <p>Pega el link donde publicaste la carpeta (por ejemplo, el de Netlify o GitHub Pages).</p>
  <label for="u">Link de la realidad aumentada</label>
  <input id="u" type="url" placeholder="https://...">
  <div class="sticker" id="st" hidden><img id="qr" alt="Código QR"><span>Escanéame: cartel vivo</span></div>
  <p>Para guardarlo: mantén presionado (o clic derecho) sobre el código y elige "Guardar imagen". Imprímelo de 2.5 a 3 cm por lado en una esquina del cartel.</p>
</div>
<script>
const u = document.getElementById("u");
u.addEventListener("input", () => {
  const v = u.value.trim();
  document.getElementById("st").hidden = !v;
  if (!v) return;
  const q = qrcode(0, "M"); q.addData(v); q.make();
  document.getElementById("qr").src = q.createDataURL(8, 2);
});
</script>
</body>
</html>
